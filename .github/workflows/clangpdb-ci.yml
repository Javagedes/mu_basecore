name: CLANGPDB Package CI

on:
  workflow_dispatch:
  push:
    branches:
      - release/202511
  pull_request:
    branches:
      - release/202511

jobs:
  gather-packages:
    name: Gather Repository Packages
    uses: ./.github/workflows/gather-packages.yml
    with:
      # Manually declared package configurations.
      package-config: |
        - packages: MdeModulePkg
          targets: RELEASE
          toolchain: CLANGPDB
          architectures: IA32,X64,AARCH64
        - packages: MdeModulePkg
          targets: DEBUG
          toolchain: CLANGPDB
          architectures: IA32,X64,AARCH64
      # Default config applied to any undeclared packages in the repo
      default-config: |
        targets: DEBUG,RELEASE
        toolchain: CLANGPDB
        architectures: IA32,X64,AARCH64

  windows-ci:
    name: Windows CLANGPDB CI

    needs: gather-packages

    uses: ./.github/workflows/package-ci.yml
    with:
      package-config: ${{ needs.gather-packages.outputs.packages }}
      container: ghcr.io/microsoft/mu_devops/ubuntu-24-test:latest
      python-version: '3.12'

  ubuntu-ci:
    name: Ubuntu CLANGPDB CI

    needs: gather-packages

    uses: ./.github/workflows/package-ci.yml
    with:
      package-config: ${{ needs.gather-packages.outputs.packages }}
      container: ghcr.io/microsoft/mu_devops/ubuntu-24-test:latest
      python-version: '3.12'
