name: Package CI

on:
  workflow_dispatch:
  push:
    branches:
      - release/202511
  pull_request:
    branches:
      - release/202511

jobs:
  gather-packages:
    name: Gather Repository Packages

    runs-on: ubuntu-latest

    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Discover and validate packages
        id: set-packages
        shell: bash
        run: |
          # Hardcoded package configurations
          declare -A PACKAGE_TARGETS
          PACKAGE_TARGETS[ArmPkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[ArmPlatformPkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[BaseTools]="DEBUG,RELEASE"
          PACKAGE_TARGETS[CryptoPkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[DynamicTablesPkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[EmbeddedPkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[FatPkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[FmpDevicePkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[IntelFsp2Pkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[IntelFsp2WrapperPkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[MdeModulePkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[MdePkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[NetworkPkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[PcAtChipsetPkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[PolicyServicePkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[PrmPkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[SecurityPkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[ShellPkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[StandaloneMmPkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[UefiCpuPkg]="DEBUG,RELEASE"
          PACKAGE_TARGETS[UnitTestFrameworkPkg]="DEBUG,RELEASE"

          # Discover directories ending in "Pkg" at the repo root
          CONFIG="[]"
          for dir in */; do
            pkg="${dir%/}"
            if [[ -n "${PACKAGE_TARGETS[$pkg]+x}" ]]; then
              targets="${PACKAGE_TARGETS[$pkg]}"
              CONFIG=$(echo "$CONFIG" | jq -c --arg p "$pkg" --arg t "$targets" '. + [{"packages": $p, "targets": $t}]')
            fi
          done

          echo "Discovered config: $CONFIG"
          echo "packages=$CONFIG" >> "$GITHUB_OUTPUT"

  package-ci:
    name: "[${{ matrix.config.packages }}] [${{ matrix.config.targets }}] [${{ matrix.architectures }}] (${{ matrix.os }})"

    needs: gather-packages

    runs-on: ${{ matrix.os }}

    container:
      image: ${{ matrix.container || null }}
      options: --security-opt seccomp=unconfined

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        container: ['', 'ghcr.io/microsoft/mu_devops/ubuntu-24-test:latest']
        architectures: ['AARCH64,X64']
        toolchain: ['CLANGPDB']
        config: ${{ fromJson(needs.gather-packages.outputs.packages) }}

        exclude:
          # Exclude container builds on Windows
          - os: windows-latest
            container: 'ghcr.io/microsoft/mu_devops/ubuntu-24-test:latest'
          # Exclude non-container builds on Ubuntu
          - os: ubuntu-latest
            container: ''
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Container Configuration
        if: ${{ matrix.container != null }}
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
      - name: Setup Python 3.12
        if: ${{ matrix.container == null }}
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
          cache: 'pip'
          cache-dependency-path: pip-requirements.txt
      
      - name: Install Python dependencies
        run: pip install -r pip-requirements.txt
      
      - name: EDK II Package CI
        id: package-ci
        uses: ./.github/actions/package-ci
        with:
          ci-config: '.pytool/CISettings.py'
          packages: ${{ matrix.config.packages }}
          targets: ${{ matrix.config.targets }}
          architectures: ${{ matrix.architectures }}
          toolchain: ${{ matrix.toolchain }}
          stuart-setup: 'true'
          stuart-ci-setup: 'false'
      
      - name: Upload CI build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-${{ matrix.config.packages }}-${{ matrix.config.targets }}-${{ matrix.architectures }}-${{ matrix.os }}
          path: ${{ steps.package-ci.outputs.log-path }}
