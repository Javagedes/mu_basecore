name: Package CI

on:
  workflow_dispatch:
  push:
    branches:
      - release/202511
  pull_request:
    branches:
      - release/202511

env:
  PACKAGE_CONFIG: |
    - packages: 'MdePkg,UefiCpuPkg'
      targets: 'DEBUG,RELEASE,NO-TARGET,NOOPT'

jobs:
  gather-packages:
    name: Gather Repository Packages

    runs-on: ubuntu-latest

    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Discover and validate packages
        id: set-packages
        shell: bash
        run: |
          # Convert YAML config from env to JSON, then validate against repo directories
          CONFIG=$(echo "$PACKAGE_CONFIG" | yq -o=json -I=0 '.')

          if ! echo "$CONFIG" | jq empty 2>/dev/null; then
            echo "::error::Invalid configuration in PACKAGE_CONFIG"
            exit 1
          fi

          VALIDATED="[]"
          for entry in $(echo "$CONFIG" | jq -c '.[]'); do
            pkg=$(echo "$entry" | jq -r '.packages')
            # Check each comma-separated package name exists as a directory
            all_found=true
            IFS=',' read -ra PKGS <<< "$pkg"
            for p in "${PKGS[@]}"; do
              if [[ ! -d "$p" ]]; then
                echo "::warning::Package directory '$p' not found in repo root, skipping entry"
                all_found=false
                break
              fi
            done
            if $all_found; then
              VALIDATED=$(echo "$VALIDATED" | jq -c --argjson e "$entry" '. + [$e]')
            fi
          done

          # Collect all packages already declared in config
          DECLARED_PKGS=()
          for entry in $(echo "$VALIDATED" | jq -c '.[]'); do
            IFS=',' read -ra PKGS <<< "$(echo "$entry" | jq -r '.packages')"
            DECLARED_PKGS+=("${PKGS[@]}")
          done

          # Find *Pkg directories not already in config
          UNDECLARED=()
          for dir in *Pkg/; do
            pkg="${dir%/}"
            found=false
            for declared in "${DECLARED_PKGS[@]}"; do
              if [[ "$declared" == "$pkg" ]]; then
                found=true
                break
              fi
            done
            if ! $found; then
              UNDECLARED+=("$pkg")
            fi
          done

          # Append undeclared packages as a single entry with default targets
          if [[ ${#UNDECLARED[@]} -gt 0 ]]; then
            UNDECLARED_CSV=$(IFS=','; echo "${UNDECLARED[*]}")
            echo "Appending undeclared packages: $UNDECLARED_CSV"
            VALIDATED=$(echo "$VALIDATED" | jq -c --arg p "$UNDECLARED_CSV" --arg t "DEBUG,RELEASE,NO-TARGET,NOOPT" '. + [{"packages": $p, "targets": $t}]')
          fi

          echo "Discovered config: $VALIDATED"
          echo "packages=$VALIDATED" >> "$GITHUB_OUTPUT"

  package-ci:
    name: "[${{ matrix.config.packages }}] [${{ matrix.config.targets }}] [${{ matrix.architectures }}] (${{ matrix.os }})"

    needs: gather-packages

    runs-on: ${{ matrix.os }}

    container:
      image: ${{ matrix.container || null }}
      options: --security-opt seccomp=unconfined

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        container: ['', 'ghcr.io/microsoft/mu_devops/ubuntu-24-test:latest']
        architectures: ['AARCH64,X64']
        toolchain: ['CLANGPDB']
        config: ${{ fromJson(needs.gather-packages.outputs.packages) }}

        exclude:
          # Exclude container builds on Windows
          - os: windows-latest
            container: 'ghcr.io/microsoft/mu_devops/ubuntu-24-test:latest'
          # Exclude non-container builds on Ubuntu
          - os: ubuntu-latest
            container: ''
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Container Configuration
        if: ${{ matrix.container != null }}
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
      - name: Setup Python 3.12
        if: ${{ matrix.container == null }}
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
          cache: 'pip'
          cache-dependency-path: pip-requirements.txt
      
      - name: Install Python dependencies
        run: pip install -r pip-requirements.txt
      
      - name: EDK II Package CI
        id: package-ci
        uses: ./.github/actions/package-ci
        with:
          ci-config: '.pytool/CISettings.py'
          packages: ${{ matrix.config.packages }}
          targets: ${{ matrix.config.targets }}
          architectures: ${{ matrix.architectures }}
          toolchain: ${{ matrix.toolchain }}
          stuart-setup: 'true'
          stuart-ci-setup: 'false'
      
      - name: Upload CI build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-${{ matrix.config.packages }}-${{ matrix.config.targets }}-${{ matrix.architectures }}-${{ matrix.os }}
          path: ${{ steps.package-ci.outputs.log-path }}
