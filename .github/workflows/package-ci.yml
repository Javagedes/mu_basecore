name: Package CI

on:
  workflow_call:
    inputs:
      package-config:
        description: >
          A YAML array of objects. Each object must have a "packages" key.
          All other keys are passed through to the output.
          Example:
            - packages: 'MdePkg,UefiCpuPkg'
              targets: 'DEBUG,RELEASE,NO-TARGET,NOOPT'
              architectures: 'X64,AARCH64'
            - packages: 'ShellPkg'
              targets: 'DEBUG'
        type: string
        required: true
      container:
        description: A container image to run the build in when using a linux runner.
        type: string
        required: true
      python-version:
        description: Python version to use when not running in a container
        type: string
        required: false
        default: '3.12'
      runner:
        description: The type of runner to use for the CI build. Possible values are 'ubuntu-latest', 'windows-latest', and 'self-hosted'. Default is 'ubuntu-latest'.
        type: string
        required: false
        default: 'ubuntu-latest'

jobs:
  package-ci:

    name: "[${{ matrix.packages }}] [${{ matrix.targets }}]"

    runs-on: ${{ inputs.runner }}

    container:
      image: ${{ inputs.container || null }}
      options: --security-opt seccomp=unconfined

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.package-config) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Container Configuration
        if: ${{ inputs.container != null }}
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
      - name: Setup Python ${{ inputs.python-version }}
        if: ${{ inputs.container == null }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
          cache-dependency-path: pip-requirements.txt
      
      - name: Install Python dependencies
        run: pip install -r pip-requirements.txt
      
      - name: EDK II Package CI
        id: package-ci
        uses: ./.github/actions/stuart-ci
        with:
          ci-config: '.pytool/CISettings.py'
          packages: ${{ matrix.packages }}
          targets: ${{ matrix.targets }}
          architectures: ${{ matrix.architectures }}
          toolchain: ${{ matrix.toolchain }}
          stuart-setup: 'true'
          stuart-ci-setup: 'false'
      
      - name: Upload CI build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-${{ matrix.packages }}-${{ matrix.targets }}-${{ inputs.runner }}
          path: ${{ steps.package-ci.outputs.log-path }}
