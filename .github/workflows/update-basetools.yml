name: Update BaseTools Binaries External Dependency

on:
  schedule:
    - cron: '0 22 * * 6' # Every Saturday at 22:00 UTC
  workflow_dispatch: # Manual trigger

env:
  ARTIFACT_BASE_URL: https://github.com/microsoft/mu_basecore/releases/download
  BASETOOLS_PATH: BaseTools/Bin/basetoolsbin_ext_dep.yaml
  REPO: ${{ github.repository }}

jobs:
  check:
    name: Find New Releases

    runs-on: ubuntu-latest
  
    steps:
      # Comment out this step if testing on fork
      # - name: Generate Token
      #   id: app-token
      #   uses: actions/create-github-app-token@v2
      #   with:
      #     app-id: ${{ vars.MU_ACCESS_APP_ID }}
      #     private-key: ${{ secrets.MU_ACCESS_APP_PRIVATE_KEY }}
      #     owner: ${{ github.repository_owner }}

      - name: Install Dependencies
        run: sudo apt-get install -y jq gh
  
      - name: Check if any releases have been made this week
        id: tag
        shell: bash
        env:
          # GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_JSON=$(gh release list --repo "${REPO}" --limit 100 --json tagName,publishedAt)

          # Find the most recent dev tag (may be empty)
          DEV_TAG=$(echo "$RELEASE_JSON" | jq -r --arg cutoff "$CUTOFF_DATE" '
            [ .[] | select(.publishedAt >= $cutoff and (.tagName | startswith("dev"))) ]
            | sort_by(.publishedAt)
            | reverse
            | .[0]?.tagName // empty
          ')

          # Find the most recent release tag (may be empty)
          RELEASE_TAG=$(echo "$RELEASE_JSON" | jq -r --arg cutoff "$CUTOFF_DATE" '
            [ .[] | select(.publishedAt >= $cutoff and (.tagName | startswith("dev") | not)) ]
            | sort_by(.publishedAt)
            | reverse
            | .[0]?.tagName // empty
          ')

          if [[ -n $DEV_TAG ]]; then
            echo "Most recent dev tag: $DEV_TAG"
            echo "dev_tag=$DEV_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "No recent dev tag found."
          fi

          if [[ -n $RELEASE_TAG ]]; then
            echo "Most recent release tag: $RELEASE_TAG"
            echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "No recent release tag found."
          fi
