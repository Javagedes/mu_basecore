# A reusable workflow to discover and validate EDK II packages in a repository.
#
# Produces a matrix object where:
#   - default-config arrays become top-level matrix dimensions (cross-product)
#     for any undeclared *Pkg directories
#   - package-config entries go into the matrix "include" for exact combinations
#
##
# Copyright (c) Microsoft Corporation.
#
# SPDX-License-Identifier: BSD-2-Clause-Patent
##
name: Gather Packages

on:
  workflow_call:
    inputs:
      package-config:
        description: >
          A YAML array of objects placed into the matrix "include". Each
          object must have a "packages" key. All other keys are passed
          through as-is.
          Example:
            - packages: MdeModulePkg
              targets: RELEASE
              toolchain: CLANGPDB
            - packages: MdeModulePkg
              targets: DEBUG
              toolchain: CLANGPDB
        required: true
        type: string
      default-config:
        description: >
          A YAML object whose values are arrays used as top-level matrix
          dimensions. Undeclared *Pkg directories are added as the
          "packages" array. These dimensions form a cross-product.
          Example:
            targets: [DEBUG, RELEASE]
            toolchain: [CLANGPDB]
            architectures: [IA32, X64, AARCH64]
        required: true
        type: string
    outputs:
      packages:
        description: >
          A JSON matrix object with top-level dimensions from default-config,
          a "packages" array of undeclared packages, and an "include" array
          from package-config. Suitable for use with fromJson() in a matrix
          strategy.
        value: ${{ jobs.gather-packages.outputs.packages }}

jobs:
  gather-packages:
    name: Gather Repository Packages

    runs-on: ubuntu-latest

    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Discover and validate packages
        id: set-packages
        shell: bash
        env:
          PACKAGE_CONFIG: ${{ inputs.package-config }}
          DEFAULT_CONFIG: ${{ inputs.default-config }}
        run: |
          # Convert YAML inputs to JSON
          INCLUDE_JSON=$(echo "$PACKAGE_CONFIG" | yq -o=json -I=0 '.')
          DEFAULT_JSON=$(echo "$DEFAULT_CONFIG" | yq -o=json -I=0 '.')

          if ! echo "$INCLUDE_JSON" | jq empty 2>/dev/null; then
            echo "::error::Invalid configuration in package-config input"
            exit 1
          fi

          if ! echo "$DEFAULT_JSON" | jq empty 2>/dev/null; then
            echo "::error::Invalid configuration in default-config input"
            exit 1
          fi

          # Validate include entries against repo directories
          VALIDATED_INCLUDE="[]"
          for entry in $(echo "$INCLUDE_JSON" | jq -c '.[]'); do
            pkg=$(echo "$entry" | jq -r '.packages // empty')
            if [[ -z "$pkg" ]]; then
              echo "::warning::Config entry missing required 'packages' key, skipping"
              continue
            fi

            all_found=true
            IFS=',' read -ra PKGS <<< "$pkg"
            for p in "${PKGS[@]}"; do
              if [[ ! -d "$p" ]]; then
                echo "::warning::Package directory '$p' not found in repo root, skipping entry"
                all_found=false
                break
              fi
            done
            if $all_found; then
              VALIDATED_INCLUDE=$(echo "$VALIDATED_INCLUDE" | jq -c --argjson e "$entry" '. + [$e]')
            fi
          done

          # Collect all packages declared in include entries
          DECLARED_PKGS=()
          for entry in $(echo "$VALIDATED_INCLUDE" | jq -c '.[]'); do
            IFS=',' read -ra PKGS <<< "$(echo "$entry" | jq -r '.packages')"
            DECLARED_PKGS+=("${PKGS[@]}")
          done

          # Find *Pkg directories not already declared
          UNDECLARED="[]"
          for dir in *Pkg/; do
            pkg="${dir%/}"
            found=false
            for declared in "${DECLARED_PKGS[@]}"; do
              if [[ "$declared" == "$pkg" ]]; then
                found=true
                break
              fi
            done
            if ! $found; then
              echo "Undeclared package: $pkg"
              UNDECLARED=$(echo "$UNDECLARED" | jq -c --arg p "$pkg" '. + [$p]')
            fi
          done

          # Build the matrix object:
          #   - default-config dimensions + packages array = cross-product
          #   - package-config entries = include (exact combinations)
          OUTPUT=$(echo "$DEFAULT_JSON" | jq -c --argjson pkgs "$UNDECLARED" --argjson inc "$VALIDATED_INCLUDE" '. + {"packages": $pkgs, "include": $inc}')

          echo "::group::Generated matrix JSON"
          echo "$OUTPUT" | jq .
          echo "::endgroup::"
          echo ""
          echo "packages=$OUTPUT" >> "$GITHUB_OUTPUT"
