# A reusable workflow to discover and validate EDK II packages in a repository.
#
# Accepts a YAML package configuration and a default configuration object for
# any packages found in the repo but not explicitly listed.
#
# Each config entry must have a "packages" key. All other keys (targets,
# architectures, etc.) are passed through as-is to the output.
#
##
# Copyright (c) Microsoft Corporation.
#
# SPDX-License-Identifier: BSD-2-Clause-Patent
##
name: Gather Packages

on:
  workflow_call:
    inputs:
      package-config:
        description: >
          A YAML array of objects. Each object must have a "packages" key.
          All other keys are passed through to the output.
          Example:
            - packages: 'MdePkg,UefiCpuPkg'
              targets: 'DEBUG,RELEASE,NO-TARGET,NOOPT'
              architectures: 'X64,AARCH64'
            - packages: 'ShellPkg'
              targets: 'DEBUG'
        required: true
        type: string
      default-config:
        description: >
          A YAML object of default properties (excluding "packages") applied
          to any *Pkg directories found in the repo root that are not covered
          by package-config. The discovered packages are joined as a single
          comma-separated entry.
          Example:
            targets: 'DEBUG,RELEASE,NO-TARGET,NOOPT'
            architectures: 'X64'
        required: true
        type: string
    outputs:
      packages:
        description: >
          A JSON array of validated package configuration objects suitable
          for use with fromJson() in a matrix strategy.
        value: ${{ jobs.gather-packages.outputs.packages }}

jobs:
  gather-packages:
    name: Gather Repository Packages

    runs-on: ubuntu-latest

    outputs:
      packages: ${{ steps.set-packages.outputs.packages }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Discover and validate packages
        id: set-packages
        shell: bash
        env:
          PACKAGE_CONFIG: ${{ inputs.package-config }}
          DEFAULT_CONFIG: ${{ inputs.default-config }}
        run: |
          # Convert YAML config from input to JSON, then validate against repo directories
          CONFIG=$(echo "$PACKAGE_CONFIG" | yq -o=json -I=0 '.')

          if ! echo "$CONFIG" | jq empty 2>/dev/null; then
            echo "::error::Invalid configuration in package-config input"
            exit 1
          fi

          # Convert default config YAML object to JSON
          DEFAULT_JSON=$(echo "$DEFAULT_CONFIG" | yq -o=json -I=0 '.')

          if ! echo "$DEFAULT_JSON" | jq empty 2>/dev/null; then
            echo "::error::Invalid configuration in default-config input"
            exit 1
          fi

          VALIDATED="[]"
          for entry in $(echo "$CONFIG" | jq -c '.[]'); do
            pkg=$(echo "$entry" | jq -r '.packages // empty')
            if [[ -z "$pkg" ]]; then
              echo "::warning::Config entry missing required 'packages' key, skipping"
              continue
            fi

            # Check each comma-separated package name exists as a directory
            all_found=true
            IFS=',' read -ra PKGS <<< "$pkg"
            for p in "${PKGS[@]}"; do
              if [[ ! -d "$p" ]]; then
                echo "::warning::Package directory '$p' not found in repo root, skipping entry"
                all_found=false
                break
              fi
            done
            if $all_found; then
              VALIDATED=$(echo "$VALIDATED" | jq -c --argjson e "$entry" '. + [$e]')
            fi
          done

          # Collect all packages already declared in config
          DECLARED_PKGS=()
          for entry in $(echo "$VALIDATED" | jq -c '.[]'); do
            IFS=',' read -ra PKGS <<< "$(echo "$entry" | jq -r '.packages')"
            DECLARED_PKGS+=("${PKGS[@]}")
          done

          # Find *Pkg directories not already in config
          UNDECLARED=()
          for dir in *Pkg/; do
            pkg="${dir%/}"
            found=false
            for declared in "${DECLARED_PKGS[@]}"; do
              if [[ "$declared" == "$pkg" ]]; then
                found=true
                break
              fi
            done
            if ! $found; then
              UNDECLARED+=("$pkg")
            fi
          done

          # Append undeclared packages as a single entry using default config
          if [[ ${#UNDECLARED[@]} -gt 0 ]]; then
            UNDECLARED_CSV=$(IFS=','; echo "${UNDECLARED[*]}")
            echo "Appending undeclared packages: $UNDECLARED_CSV"
            VALIDATED=$(echo "$VALIDATED" | jq -c --arg p "$UNDECLARED_CSV" --argjson d "$DEFAULT_JSON" '. + [$d + {"packages": $p}]')
          fi

          echo "Discovered config: $VALIDATED"
          echo "packages=$VALIDATED" >> "$GITHUB_OUTPUT"
